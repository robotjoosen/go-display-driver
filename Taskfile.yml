version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  install:
    desc: Download the latest release and install go-display-driver as a systemd service
    platforms: [linux/arm64, linux/arm]
    cmds:
      - bash scripts/install.sh

  uninstall:
    desc: Stop and remove the go-display-driver systemd service and binary
    platforms: [linux/arm64, linux/arm]
    cmds:
      - bash scripts/uninstall.sh

  update:
    desc: Update an existing go-display-driver install to the latest release
    platforms: [linux/arm64, linux/arm]
    cmds:
      - bash scripts/update.sh

  build:
    cmds:
      - cmd: env GOOS=darwin go build -ldflags "-X main.version={{.VERSION}}" -o ./bin/darwin/display-driver ./cmd/app
        platforms: [darwin]
      - cmd: env GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version={{.VERSION}}" -o ./bin/arm/display-driver ./cmd/app
        platforms: [linux/arm64, linux/arm]

  build:darwin:
      - cmd: env GOOS=darwin go build -ldflags "-X main.version={{.VERSION}}" -o ./bin/darwin/display-driver ./cmd/app

  build:arm:
      - cmd: env GOOS=linux GOARCH=arm go build -ldflags "-X main.version={{.VERSION}}" -o ./bin/arm/display-driver ./cmd/app
